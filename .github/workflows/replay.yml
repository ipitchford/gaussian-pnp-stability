# SPDX-License-Identifier: MIT
name: Replay
on:
  push:
  pull_request:
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check SHA256SUMS
        run: sha256sum -c SHA256SUMS
      - name: Certificate checker (standard library only)
        run: python -I -B check_certificates.py | diff - certificate_check_output.txt
      - name: Semantic negative controls
        run: python -I -B negative_controls.py
      - name: Install sympy
        run: pip install sympy==1.13.3
      - name: Full replay from a temporary copy
        run: python -I -B replay_all.py
      - name: Working tree unchanged
        run: test -z "$(git status --porcelain)"
