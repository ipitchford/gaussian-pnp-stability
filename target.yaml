target_id: sharp-gaussian-pnp-dimension-and-gap
search_date: 2026-10-20 (bounded search extended through 2026-10-27)
intended_contribution_unit: theorem-and-explicit-construction
claim:
  record_updated: 2026-10-27 (final version; supersedes the 2026-10-20 pre-revision claim)
  exact_statement: |
    For n <= 3, K symmetric, nonnegative, irreducible, K_ii=1,
    K_ij<=1 and B symmetric PSD with B e=b e, b>0 imply Schur stability
    of P(t)=W(I-tB) and R(t)=I-W+(I+tB)^(-1)(2W-I) for
    0<t<2/rho(B), where W=diag(K e)^(-1)K (via Banerjee-Chaudhury Thm 1.3).
    In n=4 one fixed strictly positive symmetric stochastic SPD A and
    one fixed stationary probability vector pi admit, for every prescribed
    0<t<=1/2, a genuine Gaussian K_t with condition(K_t)<19.22 for which
    both operators have a real eigenvalue >1, with fixed B=A^2. Along
    epsilon=t/100000 instability holds exactly for 0<t<t*=0.53128532534...
    Theorem 4 classifies the four-state family exactly on
    [0,1e-4]x(0,2): unstable iff Delta(epsilon,t)<0, eps_crit=1.6946633e-5.
    A gap-dependent sufficient bound t < g/sqrt(kappa_pi) holds; the
    order g is sharp within the family, the constant is off by about 8,600.
    A separate n=12 Gaussian family with fixed positive symmetric circulant
    A (condition(A)=12) is unstable along epsilon=t^2 exactly for
    0<t<t_c=1.9157074941...e-4 (certified; Appendix C).
    Without unit diagonals, a reversible positive kernel fails in n=3.
    Symmetric W with spectrum in (-1,1] is stable iff ker(I-W) and ker B
    meet only in 0 (extends Athalye, Chaudhury and Kumar 2023).
  exclusions:
    - Not the first disproof of the unrestricted Banerjee-Chaudhury conjecture (Patel's MathDB post; checked by a referee, labelled unverified by MathDB).
    - Not the first general linear-kernel ADMM divergence example.
    - The symmetric-denoiser characterisation is a modest extension of Athalye et al. (2023).
    - Does not claim one fixed positive denoiser is unstable at all small steps.
    - Does not claim natural-image overlapping-patch consistency or any imaging experiment.
    - Does not claim twelve is minimal under a circulant forward-map restriction.
    - The gap dependence has sharp order, not a sharp numerical constant.
    - Does not claim historical priority from a negative search result.
    - Practical growth is tiny: at most about 1.7e-5 per iteration (four-state), 3.6e-8 (circulant).
